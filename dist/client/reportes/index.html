<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="main_header">
        <h1 id="title">
            Reportes
        </h1>
    </header>
    <div id="form_container">
        <form id="reporting_form">
            <h3 class="head_subtitle">
                Redactar nuevo reporte
            </h3>
            <div id="reporting_inputs_container">
                <input type="text" autocomplete="off" id="reporting_field" class="field" placeholder="Problema técnico">
                <input type="text" autocomplete="off" id="student_name"  class="field" placeholder="Nombre del estudiante">
                <input type="text" autocomplete="off" id="student_group" class="field" placeholder="Grupo">
            </div>
            <input type="submit" value="Enviar" id="send_report">
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
